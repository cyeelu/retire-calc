<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>我有需要嗎</title>
    <link rel="apple-touch-icon" href="icon.png">
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: #f4f4f9;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .card {
            background: #ffffff;
            padding: 2rem;
            border-radius: 16px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.08);
            width: 90%;
            max-width: 360px;
            text-align: center;
        }
        h2 {
            margin-top: 0;
            color: #333;
            font-size: 1.25rem;
        }
        input {
            width: 100%;
            padding: 12px;
            font-size: 1.5rem;
            text-align: center;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            box-sizing: border-box;
            margin: 1rem 0 1.5rem 0;
            outline: none;
        }
        input:focus {
            border-color: #2c3e50;
        }
        .result-box {
            background-color: #f8f9fa;
            border-radius: 10px;
            padding: 1rem;
            margin-bottom: 0.8rem;
        }
        .label {
            font-size: 0.85rem;
            color: #666;
            margin-bottom: 0.3rem;
        }
        .value {
            font-size: 1.6rem;
            font-weight: bold;
            color: #d9534f;
        }
    </style>
</head>
<body>

<div class="card">
    <h2>You will need to...</h2>
    <input type="number" inputmode="decimal" id="amount" placeholder="輸入金額 (TWD)" oninput="calculate()" autofocus>
    
    <div class="result-box">
        <div class="label">work more</div>
        <div class="value" id="work-hours">0 小時</div>
    </div>

    <div class="result-box">
        <div class="label">retire late</div>
        <div class="value" id="retire-delay">0 天</div>
    </div>
</div>

<script>
    // ==========================================
    // 【後台固定參數設定區】未來要調整只需改這裡
    // ==========================================
    const CONFIG = {
        hourlyWage: 343.75,               // 實質時薪 (元)
        yearsToRetire: 25,             // 距離目標退休年數 (年)
        realReturnRate: 0.05,          // 扣除通膨後的實質年化報酬率 (0.05 = 5%)
        retirementMonthlyExpense: 40000 // 退休後預期每月生活費 (元)
    };
    // ==========================================

    function calculate() {
        const amount = parseFloat(document.getElementById('amount').value);
        
        if (isNaN(amount) || amount <= 0) {
            document.getElementById('work-hours').innerText = "0 小時";
            document.getElementById('retire-delay').innerText = "0 天";
            return;
        }

        // 1. 計算現在工作時數
        const workHours = amount / CONFIG.hourlyWage;

        // 2. 計算晚多久退休 (天數)
        const futureValue = amount * Math.pow((1 + CONFIG.realReturnRate), CONFIG.yearsToRetire);
        const dailyRetirementCost = (CONFIG.retirementMonthlyExpense * 12) / 365;
        const delayDays = futureValue / dailyRetirementCost;

        // 顯示結果
        document.getElementById('work-hours').innerText = `${workHours.toFixed(1)} 小時`;
        
        // 若延後天數超過 365 天，自動換算為「X 年 Y 天」更直覺
        if (delayDays >= 365) {
            const years = Math.floor(delayDays / 365);
            const days = Math.round(delayDays % 365);
            document.getElementById('retire-delay').innerText = `${years} 年 ${days} 天`;
        } else {
            document.getElementById('retire-delay').innerText = `${delayDays.toFixed(1)} 天`;
        }
    }
</script>

</body>
</html>
